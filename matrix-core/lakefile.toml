name = "matrixCore"
version = "0.1.0"
defaultTargets = ["MatrixCore", "MatrixCoreTests", "mc_eval"]

[leanOptions]
pp.unicode.fun = true

[[lean_lib]]
name = "MatrixCore"
globs = ["MatrixCore", "MatrixCore.*"]

[[lean_lib]]
name = "MatrixCoreTests"
srcDir = "tests"
globs = ["MatrixCoreTests", "MatrixCoreTests.*"]

[[lean_exe]]
name = "mc_eval"
root = "Main.Eval"
