name = "mcFloatlib"
version = "0.1.0"
defaultTargets = ["MCFloat", "MCFloatTests", "mc_floatlib"]

[[require]]
name = "floatlib"
git = "https://github.com/lean-dojo/FloatLib"
rev = "0d91825727839f597fd06b22fdd038ea21480f0c"

[[lean_lib]]
name = "MCFloat"

# Compile verified Matrix-Core definitions for the equivalence proofs.
[[lean_lib]]
name = "MatrixCore"
srcDir = "reference-compat"

[[lean_lib]]
name = "MCFloatTests"
srcDir = "tests"
roots = ["Audit", "Examples"]

[[lean_exe]]
name = "mc_floatlib"
root = "Main"
