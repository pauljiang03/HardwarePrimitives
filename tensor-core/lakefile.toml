name = "tensorCore"
version = "0.1.0"
defaultTargets = ["TensorCore", "TensorCoreTests", "tc_trace", "tc_features", "tc_eft_reference", "tc_bounded_eft", "tc_lean_eft_check"]

[leanOptions]
pp.unicode.fun = true

[[lean_lib]]
name = "TensorCore"
globs = ["TensorCore", "TensorCore.*"]

[[lean_lib]]
name = "TensorCoreTests"
srcDir = "tests"
globs = ["TensorCoreTests", "TensorCoreTests.*"]

[[lean_exe]]
name = "tc_trace"
root = "Main.Trace"

[[lean_exe]]
name = "tc_features"
root = "Main.Features"

[[lean_exe]]
name = "tc_eft_reference"
root = "Main.EFT"

[[lean_exe]]
name = "tc_bounded_eft"
root = "Main.BoundedEFT"

[[lean_exe]]
name = "tc_lean_eft_check"
root = "Main.LeanEFTCheck"
